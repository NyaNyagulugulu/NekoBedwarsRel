# 位于大厅的记分板
# 标题
lobby-scoreboard:
  enabled: true
  title: '&e&l起床战争'

  # 内容
  content:
    - '§7{date}'
    - ''
    - '§f地图:§a$gamename$'
    - '§f玩家:§a$players$&f/&2$maxplayers$'
    - '§r'
    - '§f等待中...'
    - '§r§r'
    - '§f版本:§7v1.2'
    - '§r§r§r'
    - '§e梦幻次元'

  #等待状态
  state:

    #等待
    waiting: "&f等待中..."

    #开始倒计时
    countdown: "&F即将在&a{countdown}秒后开始"

  #变量 {you} 的值
  you: "&7(你)"

  #队伍床状态
  team_bed_status:

    #床存在
    bed_alive: "&a\u2714"

    #床被摧毁
    bed_destroyed: "&c\u2718"

  #队伍状态格式
  #变量:
  # {color}            队伍颜色
  # {color_name}       队伍颜色名称
  # {color_initials}   队伍颜色名称首字母
  # {team}             队伍名称
  # {team_initials}    队伍名称首字母
  # {players}          队伍人数
  # {bed_status}       队伍床状态
  team_status_format:

    #床存在
    bed_alive: "{color} {team} &a\u2714 &8(&f&l{players}&8) {you}"

    #床被摧毁
    bed_destroyed: "{color} {team} &c\u2718 &8(&f&l{players}&8) {you}"

    #队伍被消灭
    team_dead: "{color} {team} &c\u2718 &8(&f&l{players}&8) {you}"

  #计分板信息
  #变量:
  # {date}                    日期
  # {time}                    游戏时间(分钟)
  # {formattime}              格式化游戏时间
  # {game}                    游戏地图
  # {online}                  当局游戏人数
  # {bowtime}                 凋零弓时间
  # {sethealthtime_<编号>}    指定编号血量设置时间
  # {plan_<编号>}                计划信息
  # {kills}                   击杀数
  # {finalkills}              最终击杀数
  # {totalkills}              总击杀数
  # {dies}                    死亡数
  # {beds}                    破坏床数
  # {team}                    玩家队伍名称
  # {color}                   玩家队伍颜色
  # {teams}                   队伍数量
  # {player_name}             玩家名称
  # {team_peoples}            玩家队伍人数
  # {team_bed_status}         玩家队伍床状态
  # {remain_teams}            未被消灭队伍数量
  # {alive_teams}             床存在的队伍数量
  # {alive_players}           存活玩家数量
  # {team_status}             所有队伍状态
  # {no_break_bed}            允许破坏床倒计时
  # {resource_upgrade_<编号>} 资源生成点升级时间
  # {team_<team>_status}      指定队伍状态
  # {team_<team>_bed_status}  指定队伍床状态
  # {team_<team>_peoples}     指定队伍人数
  # {timer_<编号>}            自定义倒计时


# 游戏中计分板
scoreboard:
  title: '&e&l起床战争'
  #默认
  default:
    - "&7{date}"
    - ""
    - "&f{plan_plan_1} &f- &a{plan_plan_2}"
    - ""
    - "{team_status}"
    - ""
    - "&f击杀数: &a{kills}"
    - "&f最终击杀: &a{finalkills}"
    - "&f已破坏床数: &a{beds}"
    - ""
    - "&e梦幻次元"

  #当8个队伍时
  8:
    - "&7{date}"
    - ""
    - "&f{plan_plan_1} &f- &a{plan_plan_2}"
    - ""
    - "{team_status}"
    - ""
    - "&e梦幻次元"
